camera:
  type: "usb" # Change to "ip" to use an IP camera
  index: 1
  ip_url: "http://192.168.1.100:8080/video" # Update with the URL from your IP camera app
  width: 640
  height: 480
  fps: 30

model:
  path: "weights/plant_disease_classifier.onnx"
  labels: "weights/labels.json"
  confidence_threshold: 0.25
  cooldown_period: 5
  display_duration: 1.0

zmq:
  frame_port: 5555
  detection_port: 5556
  control_port: 5557

server:
  host: "0.0.0.0"
  port: 5000
  debug: false

logging:
  level: "INFO"

serial:
  port: "COM3"
  baudrate: 115200
