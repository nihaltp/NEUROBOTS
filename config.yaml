camera:
  type: "usb" # Change to "ip" to use an IP camera
  index: 1
  ip_url: "http://192.168.1.100:8080/video" # Update with the URL from your IP camera app
  width: 640
  height: 480
  fps: 30

model:
  path: "weights/plant_disease_classifier.onnx"
  labels: "weights/labels.json"
  confidence_threshold: 0.25
  cooldown_period: 5
  display_duration: 1.0

zmq:
  frame_port: 5555
  detection_port: 5556
  control_port: 5557

server:
  host: "0.0.0.0"
  port: 5000
  debug: false

logging:
  level: "INFO"

serial:
  port: "COM3"
  baudrate: 115200

wifi:
  esp_ip: "192.168.4.1"
  esp_port: 12345
  local_port: 12346

pump_control:
  mapping:
    "Tomato with Late Blight": 1
    "Tomato with Early Blight": 2
  durations:
    1: 1.5
    2: 3.0

ble:
  device_name: "NeuroBot"
  service_uuid: "3d0cf6a3-5f45-43b5-9d5b-5baf86d8a7b1"
  command_char_uuid: "d5f8a0cd-ec8a-4e48-b60d-3277a0afbd45"
  status_char_uuid: "4d869ab8-f78c-4e9f-aee5-73452e0a5e3d"

