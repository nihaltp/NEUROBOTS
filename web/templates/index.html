<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroBots Agricultural Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Google Fonts for typography (Local) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
    <!-- Socket.IO (Local) -->
    <script src="{{ url_for('static', filename='js/socket.io.js') }}"></script>
    <!-- Nipple.js (Local) -->
    <script src="{{ url_for('static', filename='js/nipplejs.min.js') }}"></script>
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>NeuroBots</h1>
            <p>Agricultural Robot Control</p>
        </header>
        
        <main>
            <div class="video-container">
                <div class="video-wrapper">
                    <!-- The MJPEG Stream -->
                    <img id="videoStream" src="/video_feed" alt="Camera Feed">
                    <!-- Overlay Canvas for Bounding Boxes -->
                    <canvas id="overlayCanvas"></canvas>
                </div>
            </div>
            
            <div class="stats-container">
                <div class="controls-panel card glass">
                    <h2>Detection Controls</h2>
                    <div class="status-indicator">
                        <span id="detectionStatusDot" class="dot active"></span>
                        <span id="detectionStatusText">Detection Enabled</span>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button id="toggleBtn" class="btn btn-danger">Disable Detection</button>
                        {% if master_mode %}
                        <button id="haltBtn" class="btn btn-danger" onclick="toggleHalt()" style="font-weight: bold; width: 40px; border-radius: 5px; transition: background-color 0.3s; display: flex; align-items: center; justify-content: center; padding: 0;">S</button>
                        {% endif %}
                    </div>
                </div>
                
                <div class="card glass">
                    <h3>Robot Status</h3>
                    <p>Connection: <strong class="text-success">Online</strong></p>
                    <p>Battery: <strong>85%</strong></p>
                    <p>Mode: <strong>Manual</strong></p>
                </div>
                
                <div class="card glass">
                    <h3>Detection Stats</h3>
                    <p>Total Diseases Found: <strong id="totalCountDisplay" class="text-danger">0</strong></p>
                    <div id="diseaseCountsList" class="disease-counts-list"></div>
                </div>
                
                <div class="card glass">
                    <h3>Latest Detections</h3>
                    <div id="detectionList" class="detection-list">
                        <p class="empty-state">No threats detected.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        let isHalted = true; // S is initially red (danger), meaning it's ready to halt. Wait, if it's red it means Halt. If clicked, it sends X and turns blue.
        
        function toggleHalt() {
            const btn = document.getElementById('haltBtn');
            let cmdToSend = isHalted ? 'F:50' : 'STOPALL';
            
            fetch('/api/command', {
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({command: cmdToSend})
            });
            
            if (isHalted) {
                // Was halted, now resuming. Button becomes red (ready to halt).
                btn.classList.remove('btn-primary');
                btn.classList.add('btn-danger');
                isHalted = false;
            } else {
                // Was moving, now halted. Button becomes blue (ready to resume).
                btn.classList.remove('btn-danger');
                btn.classList.add('btn-primary');
                isHalted = true;
            }
        }
        
        // Initialize state to moving (so clicking halts it)
        isHalted = false;
    </script>
</body>
</html>
